spring.application.name=instant-system-test

# Embedded PostgreSQL (Zonky) started at launch, ephemeral.
# Set to false and configure spring.datasource.* for a real PostgreSQL instance.
embedded.postgres.enabled=true
embedded.postgres.port=5432

# Schema is managed by Liquibase, not Hibernate.
spring.jpa.hibernate.ddl-auto=none
# default changelog: classpath:/db/changelog/db.changelog-master.yaml
logging.level.liquibase=INFO

# RFC 9457 ProblemDetail
spring.mvc.problemdetails.enabled=true

# Do not fail on unknown JSON fields (avoids @JsonIgnoreProperties on every DTO)
spring.jackson.deserialization.fail-on-unknown-properties=false
