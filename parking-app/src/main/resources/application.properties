spring.application.name=instant-system-test

# Embedded PostgreSQL (Zonky) started at launch, ephemeral.
# Set to false and configure spring.datasource.* for a real PostgreSQL instance.
embedded.postgres.enabled=true
embedded.postgres.port=5432

# Periodic synchronisation of the parking sources (disabled in tests).
parking.sync.enabled=true

# Schema is managed by Liquibase, not Hibernate.
spring.jpa.hibernate.ddl-auto=none
# default changelog: classpath:/db/changelog/db.changelog-master.yaml
logging.level.liquibase=INFO

# Entities are mapped to DTOs inside the service layer: no lazy loading during view rendering.
spring.jpa.open-in-view=false

# Poitiers data source
parking.poitiers.url=https://data.grandpoitiers.fr
spring.cloud.openfeign.client.config.poitiers.connect-timeout=5000
spring.cloud.openfeign.client.config.poitiers.read-timeout=10000
