spring.application.name=instant-system-test

# PostgreSQL embarqué (Zonky) démarré au lancement, éphémère.
# Mettre à false + renseigner spring.datasource.* pour un vrai PostgreSQL.
embedded.postgres.enabled=true
embedded.postgres.port=5432

# Le schéma est géré par Liquibase, pas par Hibernate.
spring.jpa.hibernate.ddl-auto=none
# changelog par défaut : classpath:/db/changelog/db.changelog-master.yaml
logging.level.liquibase=INFO
